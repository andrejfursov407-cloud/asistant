name: Build Windows EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openai customtkinter PyPDF2 python-docx pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --name="Google_Workspace_Assistant" asistant.py

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: Google_Workspace_Assistant_EXE
        path: dist/Google_Workspace_Assistant.exe
